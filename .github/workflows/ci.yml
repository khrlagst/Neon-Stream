name: CI

on: [push, pull_request]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install backend deps
        run: |
          cd backend
          npm ci --silent || true
      - name: Run backend and tests
        run: |
          cd backend
          node server.js &
          sleep 1
          cd ..
          node tests/backend_integration.js
      - name: Run headless playback smoke test
        run: |
          npm ci --silent
          node tests/headless_playback.js
